[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "httpdiff"
version = "0.1.0"
description = "CLI tool to diff HTTP API responses between two environments"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "rich>=13.0",
    "jinja2>=3.1",
]

[project.scripts]
httpdiff = "httpdiff.cli:main"

[tool.setuptools.packages.find]
include = ["httpdiff*"]
